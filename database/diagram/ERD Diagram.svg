<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title description">
  <title id="title">Traffic Database Entity-Relationship Diagram</title>
  <desc id="description">Four-table MySQL schema showing holidays, traffic observations, weather conditions, weather readings, keys, composite uniqueness, nullability, and cardinalities.</desc>
  <defs>
    <style>
      .canvas { fill: #ffffff; }
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #12355b; }
      .entity-title { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #12263a; letter-spacing: .4px; }
      .field { font: 16px 'Segoe UI', Arial, sans-serif; fill: #243447; }
      .key { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .constraint { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #8a4b08; }
      .relationship { fill: none; stroke: #34495e; stroke-width: 3; }
      .relation-label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #34495e; }
      .cardinality { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #9b2c2c; }
      .legend { font: 14px 'Segoe UI', Arial, sans-serif; fill: #465568; }
      .divider { stroke: #9eb1c5; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="950" />
  <text class="title" x="800" y="52" text-anchor="middle">Traffic Database Entity-Relationship Diagram</text>

  <!-- Holidays lookup -->
  <g id="holidays">
    <rect x="60" y="110" width="410" height="210" rx="12" fill="#e8f1fb" stroke="#2f6fa5" stroke-width="3" />
    <text class="entity-title" x="265" y="148" text-anchor="middle">HOLIDAYS</text>
    <line class="divider" x1="60" y1="165" x2="470" y2="165" />
    <rect x="82" y="187" width="34" height="24" rx="5" fill="#2f6fa5" />
    <text class="key" x="99" y="204" text-anchor="middle">PK</text>
    <text class="field" x="130" y="205">holiday_id : INT AUTO_INCREMENT</text>
    <rect x="82" y="233" width="34" height="24" rx="5" fill="#2f6fa5" />
    <text class="key" x="99" y="250" text-anchor="middle">UK</text>
    <text class="field" x="130" y="251">holiday_name : VARCHAR(50) NOT NULL</text>
  </g>

  <!-- Traffic observations core table -->
  <g id="traffic-observations">
    <rect x="600" y="90" width="460" height="300" rx="12" fill="#eaf7ee" stroke="#398a50" stroke-width="3" />
    <text class="entity-title" x="830" y="130" text-anchor="middle">TRAFFIC_OBSERVATIONS</text>
    <line class="divider" x1="600" y1="148" x2="1060" y2="148" />
    <rect x="624" y="169" width="34" height="24" rx="5" fill="#398a50" />
    <text class="key" x="641" y="186" text-anchor="middle">PK</text>
    <text class="field" x="674" y="187">obs_id : INT AUTO_INCREMENT</text>
    <rect x="624" y="216" width="34" height="24" rx="5" fill="#398a50" />
    <text class="key" x="641" y="233" text-anchor="middle">UK</text>
    <text class="field" x="674" y="234">date_time : DATETIME NOT NULL</text>
    <text class="field" x="624" y="280">traffic_volume : INT NOT NULL</text>
    <rect x="624" y="309" width="34" height="24" rx="5" fill="#398a50" />
    <text class="key" x="641" y="326" text-anchor="middle">FK</text>
    <text class="field" x="674" y="327">holiday_id : INT NULL</text>
    <text class="field" x="624" y="365" font-style="italic">Optional reference to HOLIDAYS</text>
  </g>

  <!-- Weather conditions lookup -->
  <g id="weather-conditions">
    <rect x="60" y="570" width="520" height="290" rx="12" fill="#e8f1fb" stroke="#2f6fa5" stroke-width="3" />
    <text class="entity-title" x="320" y="610" text-anchor="middle">WEATHER_CONDITIONS</text>
    <line class="divider" x1="60" y1="628" x2="580" y2="628" />
    <rect x="84" y="650" width="34" height="24" rx="5" fill="#2f6fa5" />
    <text class="key" x="101" y="667" text-anchor="middle">PK</text>
    <text class="field" x="134" y="668">condition_id : INT AUTO_INCREMENT</text>
    <text class="field" x="84" y="716">weather_main : VARCHAR(30) NOT NULL</text>
    <text class="field" x="84" y="759">weather_description : VARCHAR(255) NOT NULL</text>
    <line class="divider" x1="84" y1="783" x2="556" y2="783" />
    <text class="constraint" x="84" y="817">COMPOSITE UNIQUE (weather_main, weather_description)</text>
  </g>

  <!-- Weather readings child table -->
  <g id="weather-readings">
    <rect x="900" y="500" width="540" height="370" rx="12" fill="#fff3e5" stroke="#c87a20" stroke-width="3" />
    <text class="entity-title" x="1170" y="540" text-anchor="middle">WEATHER_READINGS</text>
    <line class="divider" x1="900" y1="558" x2="1440" y2="558" />
    <rect x="924" y="579" width="34" height="24" rx="5" fill="#c87a20" />
    <text class="key" x="941" y="596" text-anchor="middle">PK</text>
    <text class="field" x="974" y="597">reading_id : INT AUTO_INCREMENT</text>
    <rect x="924" y="622" width="34" height="24" rx="5" fill="#c87a20" />
    <text class="key" x="941" y="639" text-anchor="middle">FK</text>
    <text class="field" x="974" y="640">obs_id : INT NOT NULL</text>
    <rect x="924" y="665" width="34" height="24" rx="5" fill="#c87a20" />
    <text class="key" x="941" y="682" text-anchor="middle">FK</text>
    <text class="field" x="974" y="683">condition_id : INT NOT NULL</text>
    <text class="field" x="924" y="728">temp_k : DECIMAL(6,2) NULL</text>
    <text class="field" x="924" y="764">rain_1h : DECIMAL(7,2) NULL</text>
    <text class="field" x="924" y="800">snow_1h : DECIMAL(5,2) NULL</text>
    <text class="field" x="924" y="836">clouds_all : INT NULL</text>
  </g>

  <!-- Relationships with explicit endpoint cardinalities -->
  <path class="relationship" d="M470 220 H535 V240 H600" />
  <text class="relation-label" x="535" y="202" text-anchor="middle">optional holiday</text>
  <text class="cardinality" x="480" y="246">0..1</text>
  <text class="cardinality" x="548" y="265">0..*</text>

  <path class="relationship" d="M830 390 V455 H900 V590" />
  <text class="relation-label" x="865" y="442" text-anchor="middle">has readings</text>
  <text class="cardinality" x="810" y="421">1</text>
  <text class="cardinality" x="852" y="576">0..*</text>

  <path class="relationship" d="M580 710 H900" />
  <text class="relation-label" x="740" y="692" text-anchor="middle">classifies readings</text>
  <text class="cardinality" x="596" y="737">1</text>
  <text class="cardinality" x="844" y="737">0..*</text>

  <text class="legend" x="800" y="910" text-anchor="middle">PK = primary key | FK = foreign key | UK = unique key | NULL = optional column | Cardinalities reflect the SQL constraints</text>
</svg>
